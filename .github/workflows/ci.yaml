name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          previous=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//') || true
          release=false
          if [ "$EVENT" = "push" ] && [ "$version" != "$previous" ]; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version already exists, skipping release"
            else
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-22.04
            name: linux-x64
            exe: hemtt
          - runner: windows-latest
            name: windows-x64
            exe: hemtt.exe
          - runner: macos-latest
            name: darwin-arm64
            exe: hemtt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os.name }}
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Compile
        run: cargo build --release --locked
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os.name }}
          path: target/release/${{ matrix.os.exe }}

  release:
    name: Release
    if: needs.check.outputs.release == 'true'
    needs:
      - check
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux x64
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: release/linux-x64

      - name: Download Windows x64
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release/windows-x64

      - name: Download MacOS ARM64
        uses: actions/download-artifact@v8
        with:
          name: darwin-arm64
          path: release/darwin-arm64

      - name: Zip
        shell: bash
        run: |
          cd release
          (cd linux-x64 && chmod +x hemtt && zip ../linux-x64.zip hemtt)
          (cd windows-x64 && zip ../windows-x64.zip hemtt.exe)
          (cd darwin-arm64 && zip ../darwin-arm64.zip hemtt)

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HEMTT Launcher $TAG" \
            --notes "Built from $GITHUB_REPOSITORY@$GITHUB_SHA" \
            release/linux-x64.zip \
            release/windows-x64.zip \
            release/darwin-arm64.zip

  winget:
    needs:
    - release
    runs-on: windows-latest
    steps:
    # Requires forked winget-pkgs: https://github.com/microsoft/winget-pkgs to the same account as this project
    - name: Submit to WinGet
      uses: vedantmgoyal9/winget-releaser@v2
      with:
        identifier: BrettMayson.HEMTT
        installers-regex: 'windows-x64.zip'
        release-repository: hemtt/launcher
        token: ${{ secrets.WINGET_TOKEN }} # Classic Personal Access Token with [public_repo, workflow] scopes
