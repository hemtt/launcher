[package]
name = "hemtt-v"
description = "HEMTT Launcher & Updater"
version = "2.0.0"
edition = "2024"
license = "GPL-2.0"
authors = ["Brett Mayson <brett@mayson.io>"]
repository = "https://github.com/hemtt/launcher"

[[bin]]
name = "hemtt"
path = "src/main.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
cognitive_complexity = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
fs-err = "3.3.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
semver = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
