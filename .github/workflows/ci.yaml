name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          previous=""
          if [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE:Cargo.toml" 2>/dev/null | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1) || true
          fi
          release=false
          if [ "$EVENT" = "push" ] && [ "$version" != "$previous" ]; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version already exists, skipping release"
            else
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-22.04
            name: linux-x64
            exe: hemtt
          - runner: windows-latest
            name: windows-x64
            exe: hemtt.exe
          - runner: macos-latest
            name: darwin-arm64
            exe: hemtt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os.name }}
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Compile
        run: cargo build --release --locked
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os.name }}
          path: target/release/${{ matrix.os.exe }}

  release:
    name: Release
    if: needs.check.outputs.release == 'true'
    needs:
      - check
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux x64
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: release/linux-x64

      - name: Download Windows x64
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release/windows-x64

      - name: Download MacOS ARM64
        uses: actions/download-artifact@v8
        with:
          name: darwin-arm64
          path: release/darwin-arm64

      - name: Zip
        shell: bash
        run: |
          cd release
          (cd linux-x64 && chmod +x hemtt && zip ../linux-x64.zip hemtt)
          (cd windows-x64 && zip ../windows-x64.zip hemtt.exe)
          (cd darwin-arm64 && zip ../darwin-arm64.zip hemtt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" release/*.zip \
            --title "HEMTT Launcher v$VERSION" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
